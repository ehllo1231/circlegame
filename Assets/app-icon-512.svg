<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Run the Ring app icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="60%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#000010"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d2ff"/>
      <stop offset="100%" stop-color="#5cffb8"/>
    </linearGradient>
    <linearGradient id="player" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5a1"/>
      <stop offset="100%" stop-color="#ffd13d"/>
    </linearGradient>
    <linearGradient id="spike" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Distant stars -->
  <g fill="#1e7fff" opacity="0.6">
    <circle cx="92" cy="88" r="3"/>
    <circle cx="412" cy="120" r="4"/>
    <circle cx="120" cy="360" r="2.5"/>
    <circle cx="380" cy="410" r="3"/>
    <circle cx="260" cy="64" r="2.5"/>
    <circle cx="64" cy="240" r="3.5"/>
    <circle cx="448" cy="260" r="2.8"/>
  </g>

  <!-- Orbit -->
  <circle cx="256" cy="256" r="150" stroke="url(#orbit)" stroke-width="10" fill="none" filter="url(#glow)" />

  <!-- Moving player (triangle on orbit) -->
  <g transform="translate(256 256) rotate(-40)">
    <polygon points="150 0 120 -12 120 12" fill="url(#player)" stroke="#fff6c7" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- Spikes aimed at orbit -->
  <g transform="translate(256 256)">
    <polygon points="-20 -30 -10 -140 10 -140 20 -30" fill="url(#spike)" stroke="#ff8ea0" stroke-width="2"/>
    <polygon points="30 20 140 10 140 -10 30 -20" fill="url(#spike)" stroke="#ff8ea0" stroke-width="2" transform="rotate(90)"/>
    <polygon points="-20 30 -10 140 10 140 20 30" fill="url(#spike)" stroke="#ff8ea0" stroke-width="2" transform="rotate(210)"/>
  </g>

  <!-- Center pulse -->
  <circle cx="256" cy="256" r="12" fill="#0ff2ff" opacity="0.9" filter="url(#glow)"/>
</svg>
