<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run the Ring</title>
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { border: none; }
        /* Overlays */
        .overlay { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; }
        #gameTitle { font: bold 48px Arial, sans-serif; color: #fff; margin-bottom: 24px; text-shadow: 0 0 20px #fff; }
        #stageSelect { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
        #stageSelectLabel { font: bold 22px Arial, sans-serif; color: #ddd; margin-bottom: 12px; }
        .stage-button { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 10px 22px; font: 16px Arial, sans-serif; cursor: pointer; border-radius: 6px; transition: all .2s ease; min-width: 140px; }
        .stage-button:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
        .stage-button.active { background: #fff; color: #000; box-shadow: 0 0 14px rgba(255,255,255,0.6); }
        #gameStartButton, #startButton, #restartButton, #stageSelectButton, #pauseResumeButton, #pauseStageSelectButton { background: #fff; color: #000; border: none; padding: 15px 30px; font: bold 18px Arial, sans-serif; cursor: pointer; border-radius: 8px; transition: all .3s ease; }
        #gameStartButton:hover, #startButton:hover, #restartButton:hover, #stageSelectButton:hover, #pauseResumeButton:hover, #pauseStageSelectButton:hover { background: #ccc; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        /* Game over screen */
        #gameOverScreen { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px; background: rgba(0,0,0,0.9); z-index: 10; }
        #gameOverTitle { font: bold 48px Arial, sans-serif; color: #ff4444; margin-bottom: 10px; text-shadow: 0 0 20px #ff4444; }
        #scoreDisplay { font: 24px Arial, sans-serif; color: #fff; margin-bottom: 10px; text-align: center; }
        #gameOverActions { display: flex; gap: 16px; }
        /* Pause UI */
        #pauseButton { position: absolute; top: 20px; right: 20px; z-index: 6; background: var(--pause-btn-background, rgba(10,10,10,0.35)); color: var(--pause-btn-color, rgba(255,255,255,0.85)); border: 1px solid var(--pause-btn-border, rgba(255,255,255,0.25)); padding: 8px; border-radius: 999px; cursor: pointer; transition: opacity 0.2s ease, transform 0.2s ease; display: none; width: 40px; height: 40px; align-items: center; justify-content: center; opacity: var(--pause-btn-opacity, 0.6); }
        #pauseButton:hover { opacity: var(--pause-btn-hover-opacity, 0.9); transform: translateY(-1px); }
        #pauseButton .pause-icon { position: relative; width: 16px; height: 18px; display: inline-flex; justify-content: space-between; }
        #pauseButton .pause-icon::before, #pauseButton .pause-icon::after { content: ''; width: 5px; height: 100%; background: currentColor; border-radius: 2px; display: block; }
        #gameOverPeekButton { position: absolute; top: 20px; right: 20px; z-index: 14; background: rgba(10,10,10,0.45); color: rgba(255,255,255,0.88); border: 1px solid rgba(255,255,255,0.35); padding: 8px 10px; border-radius: 999px; cursor: pointer; transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; display: none; align-items: center; justify-content: center; opacity: 0.92; box-shadow: 0 8px 24px rgba(0,0,0,0.35); backdrop-filter: blur(6px); }
        #gameOverPeekButton:hover { transform: translateY(-1px); opacity: 1; box-shadow: 0 10px 28px rgba(0,0,0,0.4); }
        #gameOverPeekButton.active { background: rgba(235,235,235,0.95); color: #050505; border-color: rgba(0,0,0,0.4); }
        #gameOverPeekButton .peek-icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        #gameOverPeekButton .peek-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: rgba(255,255,255,0.08); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        #gameOverPeekButton.active .peek-icon svg { fill: rgba(0,0,0,0.05); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        #pauseMenu { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); z-index: 12; }
        #pauseMenu .pause-card { background: rgba(12,12,12,0.9); padding: 24px 36px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
        #pauseMenu .pause-title { font: bold 28px Arial, sans-serif; color: #fff; }
        #pauseMenu .pause-actions { display: flex; gap: 16px; }
        /* Settings */
        #settingsButton { position: absolute; right: 24px; bottom: 24px; z-index: 12; background: var(--pause-btn-background, rgba(10,10,10,0.35)); color: var(--pause-btn-color, rgba(255,255,255,0.85)); border: 1px solid var(--pause-btn-border, rgba(255,255,255,0.25)); width: var(--settings-btn-size, 46px); height: var(--settings-btn-size, 46px); border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease; opacity: var(--pause-btn-opacity, 0.65); backdrop-filter: blur(6px); }
        #settingsButton:hover { opacity: var(--pause-btn-hover-opacity, 0.9); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
        #settingsButton .settings-icon { width: var(--settings-icon-size, 18px); height: var(--settings-icon-size, 18px); display: inline-flex; align-items: center; justify-content: center; }
        #settingsButton .settings-icon img,
        #settingsButton .settings-icon svg { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 6px rgba(0,0,0,0.35)); }
        #settingsButton .settings-icon svg { fill: currentColor; }
        .modal-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); z-index: 16; padding: 16px; }
        .modal-card { position: relative; background: rgba(12,12,12,0.92); padding: 24px 28px; border-radius: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 36px rgba(0,0,0,0.35); min-width: 260px; max-width: 400px; align-items: stretch; }
        .modal-title { font: bold 28px Arial, sans-serif; color: #fff; text-align: center; }
        .modal-body { color: #d0d0d0; font: 15px Arial, sans-serif; line-height: 1.5; text-align: center; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-row-actions { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        .modal-row-actions .modal-button { flex: 1 1 0; min-width: 120px; }
        .modal-button { background: #fff; color: #000; border: 1px solid #fff; padding: 12px 16px; font: 600 16px Arial, sans-serif; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .modal-button:hover { background: #e2e2e2; transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,0.25); }
        .modal-button.primary { background: #fff; color: #000; border-color: #fff; }
        .modal-button.primary:hover { background: #dcdcdc; }
        .modal-close { position: absolute; top: 8px; right: 10px; padding: 4px; background: transparent; border: none; color: rgba(255,255,255,0.85); font: bold 24px Arial, sans-serif; cursor: pointer; line-height: 1; transition: transform 0.2s ease, color 0.2s ease; }
        .modal-close:hover { color: #fff; transform: scale(1.1); }
    </style>
</head>
<body>
    <!-- Intro screen -->
    <div id="introScreen" class="overlay">
        <div id="gameTitle">Run the Ring</div>
        <button id="gameStartButton">Game Start</button>
    </div>

    <!-- Stage selection screen -->
    <div id="startScreen" class="overlay">
        <div id="stageSelect">
            <div id="stageSelectLabel">Select Stage</div>
            <div>
                <button class="stage-button" data-stage="stage1">Stage 1</button>
            </div>
            <div>
                <button class="stage-button" data-stage="stage2">Stage 2</button>
            </div>
            <div>
                <button class="stage-button" data-stage="stage3">Stage 3</button>
            </div>
        </div>
        <button id="startButton">Start Game</button>
        <button id="settingsButton" aria-label="Open settings">
            <span class="settings-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.63l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.05 7.05 0 0 0-1.7-.98l-.38-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.62.24-1.2.56-1.7.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.63l2.11 1.65c-.05.32-.07.65-.07.98s.02.66.07.98L2.06 14.63a.5.5 0 0 0-.12.63l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.5.42 1.08.74 1.7.98l.38 2.65c.05.24.27.42.5.42h4c.24 0 .45-.18.5-.42l.38-2.65c.62-.24 1.2-.56 1.7-.98l2.49 1c.23.1.5 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.63l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
                </svg>
            </span>
            <span class="sr-only">Settings</span>
        </button>
    </div>

    <div id="settingsModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-card">
            <button id="closeSettingsButton" class="modal-close" aria-label="Close settings">&times;</button>
            <div class="modal-title" id="settingsTitle">Settings</div>
            <div class="modal-actions">
                <button id="muteToggleButton" class="modal-button">Mute Audio</button>
                <button id="settingsResetButton" class="modal-button">Reset Records</button>
            </div>
        </div>
    </div>

    <div id="resetConfirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="resetConfirmTitle">
        <div class="modal-card">
            <div class="modal-title" id="resetConfirmTitle">Reset Records?</div>
            <div class="modal-body">Are you sure you want to delete all saved records?</div>
            <div class="modal-row-actions">
                <button id="confirmResetButton" class="modal-button primary">Delete</button>
                <button id="cancelResetButton" class="modal-button">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Game over screen -->
    <div id="gameOverScreen">
        <div id="gameOverTitle">Game Over!</div>
        <div id="scoreDisplay">Score: 0</div>
        <div id="gameOverActions">
            <button id="restartButton">Restart</button>
            <button id="stageSelectButton">Stage Select</button>
        </div>
    </div>
    <button id="gameOverPeekButton" aria-label="피격 장면 보기" aria-pressed="false" data-prevent-reverse="true">
        <span class="peek-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
                <path d="M2.5 12c2.5-4 6-6.5 9.5-6.5s7 2.5 9.5 6.5c-2.5 4-6 6.5-9.5 6.5S5 16 2.5 12Z" />
                <circle cx="12" cy="12" r="3.2" />
            </svg>
        </span>
        <span class="sr-only">피격 장면 보기</span>
    </button>

    <button id="pauseButton" aria-label="Pause" data-prevent-reverse="true">
        <span class="pause-icon" aria-hidden="true"></span>
        <span class="sr-only">Pause</span>
    </button>
    <div id="pauseMenu" data-prevent-reverse="true">
        <div class="pause-card">
            <div class="pause-title">Paused</div>
            <div class="pause-actions">
                <button id="pauseResumeButton" data-prevent-reverse="true">Resume</button>
                <button id="pauseStageSelectButton" data-prevent-reverse="true">Stage Select</button>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { Game } from './Game.js';
        import { CANVAS } from './Config.js';

        const canvas = document.getElementById('canvas');

        function readPositiveNumber(value) {
            const numeric = Number(value);
            return Number.isFinite(numeric) && numeric > 0 ? numeric : null;
        }

        function computeAspectRatio() {
            const configured = readPositiveNumber(CANVAS && CANVAS.aspectRatio);
            if (configured) return configured;
            const widthFromConfig = readPositiveNumber(CANVAS && CANVAS.width);
            const heightFromConfig = readPositiveNumber(CANVAS && CANVAS.height);
            if (widthFromConfig && heightFromConfig) {
                return widthFromConfig / heightFromConfig;
            }
            return 1;
        }

        function computeCanvasSize() {
            const ratio = computeAspectRatio();
            const viewportWidth = readPositiveNumber(window.innerWidth);
            const viewportHeight = readPositiveNumber(window.innerHeight);

            if (viewportWidth && viewportHeight) {
                let width = viewportWidth;
                let height = width / ratio;
                if (height > viewportHeight) {
                    height = viewportHeight;
                    width = height * ratio;
                }
                return {
                    width: Math.round(width),
                    height: Math.round(height),
                };
            }

            const configWidth = readPositiveNumber(CANVAS && CANVAS.width);
            const configHeight = readPositiveNumber(CANVAS && CANVAS.height);
            if (configWidth && configHeight) {
                return {
                    width: Math.round(configWidth),
                    height: Math.round(configHeight),
                };
            }

            const fallbackHeight = 900;
            return {
                width: Math.round(fallbackHeight * ratio),
                height: fallbackHeight,
            };
        }

        const initialSize = computeCanvasSize();
        canvas.width = initialSize.width;
        canvas.height = initialSize.height;

        const game = new Game(canvas);

        function handleResize() {
            const size = computeCanvasSize();
            game.resizeCanvas(size);
        }

        window.addEventListener('resize', handleResize);
        handleResize();

    </script>
</body>
</html>
