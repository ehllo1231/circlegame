<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Dodge</title>
    <style>
        body { margin: 0; padding: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        canvas { border: none; }
        /* Start screen */
        #startScreen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; }
        #gameTitle { font: bold 48px Arial, sans-serif; color: #fff; margin-bottom: 40px; text-shadow: 0 0 20px #fff; }
        #startButton, #restartButton { background: #fff; color: #000; border: none; padding: 15px 30px; font: bold 18px Arial, sans-serif; cursor: pointer; border-radius: 8px; transition: all .3s ease; }
        #startButton:hover, #restartButton:hover { background: #ccc; transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        /* Game over screen */
        #gameOverScreen { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); z-index: 10; }
        #gameOverTitle { font: bold 48px Arial, sans-serif; color: #ff4444; margin-bottom: 20px; text-shadow: 0 0 20px #ff4444; }
        #scoreDisplay { font: 24px Arial, sans-serif; color: #fff; margin-bottom: 40px; }
    </style>
</head>
<body>
    <!-- Start screen -->
    <div id="startScreen">
        <div id="gameTitle">Orbit Dodge</div>
        <button id="startButton">Start Game</button>
    </div>

    <!-- Game over screen -->
    <div id="gameOverScreen">
        <div id="gameOverTitle">Game Over!</div>
        <div id="scoreDisplay">Score: 0</div>
        <button id="restartButton">Restart</button>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module">
        import { Game } from './Game.js';
        import { CANVAS } from './Config.js';

        // Initialize canvas size from config and start
        const canvas = document.getElementById('canvas');
        if (CANVAS && typeof CANVAS.width === 'number' && typeof CANVAS.height === 'number') {
            canvas.width = CANVAS.width;
            canvas.height = CANVAS.height;
        }
        const game = new Game(canvas);
    </script>
</body>
</html>
