<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>흰색 원</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        canvas {
            border: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1600" height="900"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 궤도 원의 중심점과 반지름
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const orbitRadius = 200;
        const playerRadius = 15;
        
        // 주인공의 현재 각도
        let playerAngle = 0;
        
        // 회전 방향 (1: 시계방향, -1: 시계반대방향)
        let rotationDirection = 1;
        
        // 리듬 효과 변수들
        let rhythmTimer = 0;
        let backgroundScale = 1;
        const rhythmInterval = 180; // 3초 (60fps * 3초)

        // 장애물(가시) 관련 변수들
        const obstacles = [];
        const obstacleSpawnInterval = 90; // 프레임 기준, 약 1.5초마다 스폰 (60fps 가정)
        let obstacleFrameCounter = 0;
        const obstacleBaseWidth = 16; // 가시 밑변 너비
        const obstacleLength = 25; // 가시 길이 (중심을 향하는 방향)
        const obstacleSpeed = 3; // 프레임당 이동 픽셀

        // 화면 밖(코너 포함)에서 시작하도록 반지름 계산 (중심으로부터의 거리)
        const offscreenStartRadius = Math.hypot(canvas.width / 2, canvas.height / 2) + 40;

        function spawnObstacle() {
            const angle = Math.random() * Math.PI * 2;
            obstacles.push({
                angle: angle,
                radius: offscreenStartRadius,
                speed: obstacleSpeed
            });
        }

        function updateAndDrawObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.radius -= o.speed; // 중심을 향해 이동

                // 그리기: 중심 기준 회전 좌표계에서 삼각형(가시) 렌더링
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(o.angle);

                // 가시의 밑변은 o.radius 위치, 뾰족한 끝은 중심쪽 (radius - length)
                ctx.beginPath();
                ctx.moveTo(o.radius - obstacleLength, 0); // 끝(중심 방향)
                ctx.lineTo(o.radius, -obstacleBaseWidth / 2);
                ctx.lineTo(o.radius, obstacleBaseWidth / 2);
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.restore();

                // 중심을 지나친 경우 제거 (여유를 두고 제거)
                if (o.radius < -60) {
                    obstacles.splice(i, 1);
                }
            }
        }
        
        // 애니메이션 함수
        function animate() {
            // 리듬 타이머 업데이트
            rhythmTimer++;
            
            // 2초마다 리듬 효과
            if (rhythmTimer >= rhythmInterval) {
                rhythmTimer = 0;
                // 튀기는 효과 시작
                backgroundScale = 1.1;
            }
            
            // 배경 스케일 효과 (점진적으로 원래 크기로 돌아감)
            backgroundScale = Math.max(1, backgroundScale - 0.005);
            
            // 화면 지우기
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 캔버스 중심으로 변환
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(backgroundScale, backgroundScale);
            ctx.translate(-centerX, -centerY);
            
            // 기존원 (궤도) 그리기
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, 2 * Math.PI);
            ctx.stroke();
            
            // 장애물 업데이트 및 렌더링
            updateAndDrawObstacles();

            // 주인공 위치 계산
            const playerX = centerX + Math.cos(playerAngle) * orbitRadius;
            const playerY = centerY + Math.sin(playerAngle) * orbitRadius;
            
            // 주인공 그리기
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(playerX, playerY, playerRadius, 0, 2 * Math.PI);
            ctx.fill();
            
            // 변환 복원
            ctx.restore();
            
            // 주인공 각도 업데이트 (궤도를 따라 움직임)
            playerAngle += 0.01 * rotationDirection;

            // 장애물 스폰 타이밍
            obstacleFrameCounter++;
            if (obstacleFrameCounter >= obstacleSpawnInterval) {
                obstacleFrameCounter = 0;
                spawnObstacle();
            }
            
            // 애니메이션 계속 실행
            requestAnimationFrame(animate);
        }
        
        // 스페이스바로 회전 방향 전환
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                rotationDirection *= -1;
            }
        });
        
        // 애니메이션 시작
        animate();
    </script>
</body>
</html>
