<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>흰색 원</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        canvas {
            border: none;
        }
        
        /* 시작 화면 스타일 */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #gameTitle {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #ffffff;
            font-family: Arial, sans-serif;
        }
        
        #startButton {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }
        
        #startButton:hover {
            background-color: #cccccc;
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffffff;
        }
        
        /* 게임 오버 화면 스타일 */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #gameOverTitle {
            font-size: 48px;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff4444;
            font-family: Arial, sans-serif;
        }
        
        #scoreDisplay {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 40px;
            font-family: Arial, sans-serif;
        }
        
        #restartButton {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }
        
        #restartButton:hover {
            background-color: #cccccc;
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffffff;
        }
    </style>
</head>
<body>
    <!-- 시작 화면 -->
    <div id="startScreen">
        <div id="gameTitle">Orbit Dodge</div>
        <button id="startButton">게임 시작</button>
    </div>
    
    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen">
        <div id="gameOverTitle">게임 오버!</div>
        <div id="scoreDisplay">점수: 0</div>
        <button id="restartButton">다시 시작</button>
    </div>
    
    <canvas id="canvas" width="1000" height="1000"></canvas>
    
    <script type="module">
        import { Game } from './Game.js';
        
        // 게임 초기화 및 시작
        const canvas = document.getElementById('canvas');
        const game = new Game(canvas);
    </script>
</body>
</html>
